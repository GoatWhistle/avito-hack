map $time_iso8601 $log_time {
    default                       $time_iso8601;
    "~T(?<hms>\d{2}:\d{2}:\d{2})" $hms;
}

map $msec $log_msec {
    default              "000";
    "~\.(?<frac>\d{3})$" $frac;
}

map $status $status_color {
    default "\x1b[32m";
    "~^3"   "\x1b[36m";
    "~^4"   "\x1b[33m";
    "~^5"   "\x1b[31m";
}

map $request_method $method_color {
    default "\x1b[35m";
    GET     "\x1b[34m";
    POST    "\x1b[32m";
    PUT     "\x1b[33m";
    PATCH   "\x1b[33m";
    DELETE  "\x1b[31m";
}

map $request_method $method_padded {
    default $request_method;
    GET     "GET   ";
    PUT     "PUT   ";
    HEAD    "HEAD  ";
    POST    "POST  ";
    PATCH   "PATCH ";
    DELETE  "DELETE";
}

log_format pretty escape=none
    '\x1b[2m$log_time.$log_msec\x1b[0m \x1b[32m\x1b[1mINFO   \x1b[0m \x1b[1m\x1b[37mhttp request\x1b[0m           '
    '$method_color\x1b[1m$method_padded\x1b[0m \x1b[36m$uri\x1b[0m '
    '$status_color\x1b[1m$status\x1b[0m '
    '\x1b[2m${request_time}s\x1b[0m \x1b[2m${body_bytes_sent}B\x1b[0m '
    '\x1b[2mfrom $remote_addr\x1b[0m';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream backend {
    server backend:8080;
}

limit_req_zone $binary_remote_addr zone=dev_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=dev_auth_limit:10m rate=5r/s;
limit_req_status 429;

server {
    listen 8080;
    access_log /dev/stdout pretty;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.inc;

    location /health {
        access_log off;
        include /etc/nginx/security-headers.inc;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/ws {
        access_log off;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/v1/auth/ {
        limit_req zone=dev_auth_limit burst=10 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=dev_api_limit burst=40 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 10m;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
