map $time_iso8601 $log_time {
    default                       $time_iso8601;
    "~T(?<hms>\d{2}:\d{2}:\d{2})" $hms;
}

map $msec $log_msec {
    default              "000";
    "~\.(?<frac>\d{3})$" $frac;
}

map $status $status_color {
    default "\x1b[32m";
    "~^3"   "\x1b[36m";
    "~^4"   "\x1b[33m";
    "~^5"   "\x1b[31m";
}

map $request_method $method_color {
    default "\x1b[35m";
    GET     "\x1b[34m";
    POST    "\x1b[32m";
    PUT     "\x1b[33m";
    PATCH   "\x1b[33m";
    DELETE  "\x1b[31m";
}

map $request_method $method_padded {
    default $request_method;
    GET     "GET   ";
    PUT     "PUT   ";
    HEAD    "HEAD  ";
    POST    "POST  ";
    PATCH   "PATCH ";
    DELETE  "DELETE";
}

log_format pretty escape=none
    '\x1b[2m$log_time.$log_msec\x1b[0m \x1b[32m\x1b[1mINFO   \x1b[0m \x1b[1m\x1b[37mhttp request\x1b[0m           '
    '$method_color\x1b[1m$method_padded\x1b[0m \x1b[36m$uri\x1b[0m '
    '$status_color\x1b[1m$status\x1b[0m '
    '\x1b[2m${request_time}s\x1b[0m \x1b[2m${body_bytes_sent}B\x1b[0m '
    '\x1b[2mfrom $remote_addr\x1b[0m';

server {
    listen 8080;
    access_log /dev/stdout pretty;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
