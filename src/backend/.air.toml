root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "sql", "tmpl"]
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  poll = true
  poll_interval = 700
  stop_on_error = false
  send_interrupt = true
  kill_delay = 2000

[log]
  main_only = true
  time = false

[misc]
  clean_on_exit = true
