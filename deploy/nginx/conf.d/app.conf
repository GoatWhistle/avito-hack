# Reverse proxy for the production stack.
#
# Ships HTTP-only so `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`
# works on a bare IP with no certificate. After issuing a certificate (see deploy/README.md),
# switch to the HTTPS server block at the bottom of this file.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Kept open on port 80 forever: certbot renewal must reach it even after
    # every other route starts redirecting to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/conf.d/locations.inc;
}

# HTTPS. Enable after `make prod-cert DOMAIN=... LETSENCRYPT_EMAIL=...` succeeds:
