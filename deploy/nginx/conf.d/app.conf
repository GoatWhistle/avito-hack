# Reverse proxy for the production stack.
#
# Ships HTTP-only so `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`
# works on a bare IP with no certificate at all — the stack must come up before
# certbot can validate the domain over port 80.
#
# HTTPS is NOT configured by hand. After certbot succeeds run:
#
#     ./deploy/enable-https.sh ваш-домен
#
# It renders deploy/nginx/ssl.conf.template into conf.d/ssl.conf, swaps the
# locations include below for a 301 redirect, validates with `nginx -t` and
# rolls everything back if anything fails.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Kept open on port 80 forever: certbot renewal must reach it even after
    # every other route starts redirecting to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/conf.d/locations.inc;
}
