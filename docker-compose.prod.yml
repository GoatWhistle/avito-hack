services:
  postgres:
    restart: unless-stopped
    ports: !override []
    command:
      - postgres
      - -c
      - log_min_messages=warning
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  kafka:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    restart: unless-stopped
    ports: !override []
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      LOG_COLOR: never
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  frontend:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks: [frontend]

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot
      -d ${DOMAIN} --email ${LETSENCRYPT_EMAIL}
      --agree-tos --no-eff-email --non-interactive"

volumes:
  certbot-webroot:
  certbot-certs:
