name: Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/backend/**'
      - 'tests/integration/**'
      - '.golangci.yaml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'src/backend/**'
      - 'tests/integration/**'
      - '.golangci.yaml'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.1
          working-directory: src/backend
          args: --config=../../.golangci.yaml --timeout=5m

      - name: go mod tidy is clean
        working-directory: src/backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/backend/go.sum

      - name: Run tests with coverage
        working-directory: src/backend
        run: go test -race -short -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report coverage
        working-directory: src/backend
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: src/backend/coverage.out
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/backend/go.sum

      - name: Apply migrations
        working-directory: src/backend
        run: go run ./cmd/migrate up

      - name: Migrations are reversible
        working-directory: src/backend
        run: |
          go run ./cmd/migrate down
          go run ./cmd/migrate up

      - name: Run integration tests
        run: |
          if compgen -G "tests/integration/*_test.go" > /dev/null; then
            go test -race -tags=integration -count=1 ./tests/integration/...
          else
            echo "No integration tests yet, skipping"
          fi

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/backend/go.sum

      - name: govulncheck
        working-directory: src/backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
