name: Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/frontend

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Format check
        run: npm run format:check

      - name: Tests with coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/frontend/coverage
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080

      - name: Bundle size gate
        run: |
          size=$(find build/client -type f ! -name '*.map' -printf '%k\n' | awk '{total += $1} END {print total}')
          echo "Shipped bundle size: ${size}KB"
          if [ "$size" -gt 5120 ]; then
            echo "::error::bundle ${size}KB exceeds the 5120KB limit"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/build/client
          retention-days: 7
