                                    code: conflict
                                    message: state conflict
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
            description: Действие противоречит текущему состоянию ресурса.
        Forbidden:
            content:
                application/json:
                    examples:
                        default:
                            value:
                                error:
                                    code: forbidden
                                    message: access forbidden
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
            description: Ресурс существует, но действие над ним запрещено.
        InternalError:
            content:
                application/json:
                    examples:
                        default:
                            value:
                                error:
                                    code: internal_error
                                    message: internal server error
                                    request_id: 9f2a1b3c
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
            description: |
                Внутренняя ошибка. Детали наружу не раскрываются, но `request_id`
                позволяет найти запись в логах.
        NotFound:
            content:
