components:
    parameters:
        ItemID:
            description: Идентификатор объявления.
            in: path
            name: id
            required: true
            schema:
                format: uuid
                type: string
        Limit:
            description: |
                Размер страницы. По умолчанию 20, максимум 100. Значения вне
                диапазона нормализуются молча: 0 и отрицательные превращаются
                в 20, значения больше 100 — в 100. Нечисловое значение даёт 400.
            in: query
            name: limit
            required: false
            schema:
                default: 20
                maximum: 100
                type: integer
        TimeCursor:
            description: |
                Непрозрачный курсор из `next_cursor` предыдущей страницы —
                base64url от `created_at|id`. Отсутствие означает первую страницу.
                Испорченное значение даёт 400 с `field: cursor`.
            in: query
            name: cursor
            required: false
            schema:
                type: string
    responses:
        BadRequest:
            content:
                application/json:
                    examples:
                        malformed:
                            value:
                                error:
                                    code: bad_request
                                    message: 'malformed request body: json: unknown field "titel"'
                                    request_id: 9f2a1b3c
                        validation:
                            value:
                                error:
                                    code: validation_error
                                    field: title
                                    message: title must be at least 3 characters
                                    request_id: 9f2a1b3c
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
            description: |
                Некорректный запрос — нарушение валидации (`validation_error`)
                либо неразбираемое тело или неизвестное поле в нём (`bad_request`).
        Conflict:
            content:
