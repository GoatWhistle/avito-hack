                  in: query
                  name: limit
                  schema:
                    default: 20
                    maximum: 100
                    type: integer
                - description: Временной курсор из `next_cursor` предыдущей страницы.
                  in: query
                  name: cursor
                  schema:
                    type: string
                - description: Фильтр по статусу.
                  in: query
                  name: status
                  schema:
                    enum:
                        - draft
                        - moderation
                        - published
                        - sold
                        - archived
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ItemListResponse'
                    description: Страница объявлений
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Мои объявления
            tags:
                - Items
    /api/v1/leaderboard:
        get:
            description: |-
                Рейтинг по уровню, затем по опыту, затем по идентификатору (для
                устойчивости порядка). Поле `my_rank` — позиция владельца токена;
                `null`, если она неизвестна или не запрашивалась. Подсчёт ранга —
                самая дорогая часть запроса, поэтому он выполняется только при
                `with_my_rank=true` или `around=me`.

                Пагинация использует ОТДЕЛЬНЫЙ формат курсора (`level|xp|user_id`),
                несовместимый с временным курсором остальных списков. Передача
                временного курсора сюда даёт 400 с `field: cursor`.

                Параметр `around=me` переключает выдачу на окно вокруг позиции
                текущего пользователя вместо начала таблицы. Любое иное значение
                параметра игнорируется — сравнение строгое, только строка `me`.
            operationId: getLeaderboard
            parameters:
                - description: Размер страницы. По умолчанию 20, максимум 100.
                  in: query
                  name: limit
                  schema:
                    default: 20
                    maximum: 100
                    type: integer
                - description: Лидербордный курсор из `next_cursor` предыдущей страницы.
                  in: query
                  name: cursor
                  schema:
                    type: string
                - description: Значение `me` — показать окно вокруг позиции текущего пользователя.
                  in: query
                  name: around
                  schema:
                    enum:
                        - me
                    type: string
                - description: Значение `true` — посчитать и вернуть `my_rank`.
                  in: query
                  name: with_my_rank
                  schema:
                    default: false
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LeaderboardResponse'
                    description: Страница рейтинга
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Рейтинг пользователей
            tags:
                - Leaderboard
    /api/v1/pet:
        get:
            description: |-
                Текущее состояние питомца владельца токена. Питомец создаётся
                автоматически при регистрации, поэтому 404 здесь не ожидается.

                Побочный эффект чтения: перед выдачей применяется ленивое затухание
                характеристик (`satiety`, `happiness`, `energy`) пропорционально времени,
                прошедшему с `last_decay_time`. Поэтому два последовательных чтения
                без действий пользователя могут вернуть разные значения характеристик
                и производное поле `state`.

                Второй побочный эффект — автоматический чек-ин. Если за текущие сутки
                по московскому времени чек-ина ещё не было, он засчитывается прямо здесь:
                начисляется опыт, продлевается серия, выдаются награды. Тогда
                `checkin_applied` равно `true`, а объект `checkin` содержит начисленный
                опыт, уровень и параметры серии — этого достаточно, чтобы показать тост.
                Повторные чтения в тот же день ничего не меняют и возвращают
                `checkin_applied: false` без объекта `checkin`. Операция идемпотентна
                в пределах суток: параллельные запросы сериализуются блокировкой строки
                питомца, поэтому опыт начисляется ровно один раз.
                Явный `POST /api/v1/checkin` продолжает работать и остаётся
                единственным способом получить полный ответ `CheckInResult`.

                `feed_available_at` — момент, когда снова можно кормить (RFC3339).
                `null` означает, что кормление доступно прямо сейчас.
            operationId: getPet
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Pet'
                    description: Состояние питомца
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Состояние питомца
            tags:
                - Pet
    /api/v1/pet/actions/feed:
        post:
            description: |-
                Повышает `satiety`. Тело запроса не требуется.

                Не идемпотентна, но эффект ограничен: сытость упирается в потолок 100,
                а частота ограничена кулдауном в 5 часов. Повторный вызов внутри кулдауна
                возвращает 200 с неизменённой сытостью, а не ошибку — клиенту не нужно
                отличать «покормили» от «уже сыт».

                `feed_available_at` в ответе — момент, когда кормление снова станет
                доступным (RFC3339). Значение `null` означает «доступно сейчас»;
                после успешного кормления там будет время на 5 часов вперёд,
                по нему клиент строит обратный отсчёт.

                Опыт за кормление не начисляется: это забота о питомце, а не целевое
                действие на площадке. Влияние косвенное — сытость ниже 30 включает
                штрафной множитель опыта, и кормление его снимает.

                Побочный эффект: всем активным WebSocket-соединениям пользователя
                рассылается `pet.updated`.
            operationId: feedPet
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Pet'
                    description: Обновлённое состояние питомца
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Покормить питомца
            tags:
                - Pet
    /api/v1/pet/actions/stroke:
        post:
            description: |-
                Повышает `happiness`. Тело запроса не требуется.

                Не идемпотентна, но эффект ограничен: приросты счастья упираются
                в потолок 100, а частота ограничена внутренним лимитом действий —
                превышение даёт 409 (`action limit reached`).

                Побочный эффект: всем активным WebSocket-соединениям пользователя
                рассылается `pet.updated`.
            operationId: strokePet
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Pet'
                    description: Обновлённое состояние питомца
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Лимит действий исчерпан
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Погладить питомца
            tags:
                - Pet
    /api/v1/progress:
        get:
            description: |-
                Компактная выжимка для полосы прогресса: уровень, опыт, сколько
                осталось до следующего уровня, стадия и стрик. Подмножество данных
                `GET /api/v1/pet` — отдельный запрос нужен, чтобы не тянуть
                характеристики питомца ради шапки интерфейса.

                На максимальном уровне `is_max_level` равно `true`, а `xp_to_next_level`
                равно нулю.
            operationId: getProgress
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Progress'
                    description: Прогресс
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Прогресс уровня и стрика
            tags:
                - Pet
    /api/v1/quests:
        get:
            description: |-
                Набор заданий на текущий день. Состав заданий детерминирован: он
                зависит от пользователя и календарной даты (МСК), поэтому в течение
                суток список не меняется между запросами.

                Прогресс не хранится отдельным счётчиком, а вычисляется из журнала
                начислений опыта за текущие сутки, поэтому он не может разойтись
                с реальными действиями. `completed` — задание выполнено,
                `claimed` — награда за него уже начислена.
            operationId: listDailyQuests
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.QuestListResponse'
                    description: Задания на сегодня
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Ежедневные задания
            tags:
                - Quests
    /api/v1/quests/claim:
        post:
            description: |-
                Начисляет опыт за все выполненные, но ещё не оплаченные задания дня.
                Идемпотентна: награда за каждое задание выдаётся не более одного раза
                в сутки, повторный вызов ничего не начисляет и возвращает то же
                состояние списка.
            operationId: claimDailyQuests
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.QuestListResponse'
                    description: Состояние заданий после начисления
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Забрать награды за выполненные задания
            tags:
                - Quests
    /api/v1/raccoon/profile:
        get:
            description: |-
                Альтернативное представление того же питомца, ориентированное на
                экран профиля: уровень, опыт, остаток до следующего уровня, стрик,
                стадия, состояние и заработанные бейджи.

                Данные берутся из того же сервиса, что и `GET /api/v1/pet`, но поля
                названы иначе — `xp_to_next_level` вместо `next_level_xp`,
                `current_streak` вместо `streak_days`. Все идентификаторы здесь
                отдаются строками, хотя по сути являются UUID.
            operationId: getRaccoonProfile
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RaccoonProfile'
                    description: Профиль енота
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
