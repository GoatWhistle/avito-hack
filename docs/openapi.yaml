                            value:
                                error:
                                    code: not_found
                                    message: resource not found
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
            description: Ресурс не найден либо скрыт от текущего пользователя.
        Unauthorized:
            content:
                application/json:
