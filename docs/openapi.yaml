        WSClientMessage:
            description: |
                Сообщение клиента в WebSocket. Полезной нагрузки у клиентских
                сообщений нет — действие полностью задаётся полем `type`.
            properties:
                request_id:
                    description: |
                        Произвольный идентификатор запроса. Сервер вернёт его в ответе,
                        что позволяет соотнести ответ с запросом. Можно не передавать.
                    type: string
                type:
                    description: |
                        `ping` — проверка живости, `pet.get` — запрос состояния,
                        `pet.pet` — погладить питомца.
                    enum:
                        - ping
                        - pet.get
                        - pet.pet
                    type: string
            required:
                - type
            type: object
        WSErrorPayload:
            description: |
                Payload события `error`. Формат отличается от HTTP-конверта
                `ErrorEnvelope` — здесь плоский объект без обёртки и без `request_id`.
            properties:
                code:
                    description: |
                        `unknown_message` — неизвестный тип сообщения,
                        `internal_error` — не удалось выполнить действие.
                    enum:
