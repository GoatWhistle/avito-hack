    /api/v1/rewards:
        get:
            description: |-
                Полный каталог наград с отметкой прогресса текущего пользователя:
                `unlocked` — условие выполнено, `claimed` — награда уже выдана,
                `progress_current`/`progress_target` — прогресс к условию.

                Ответ обёрнут в `{items, next_cursor}` ради единообразия, но
                пагинации нет: каталог отдаётся целиком, `next_cursor` всегда пуст
                и потому отсутствует в JSON.
            operationId: listRewardCatalog
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RewardCatalogResponse'
                    description: Каталог наград
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Каталог наград
            tags:
                - Rewards
    /api/v1/rewards/{id}/activate:
        post:
            description: |-
                Превращает выданную награду в промокод. Код детерминированно
                выводится через HMAC от идентификаторов пользователя и награды,
                поэтому одна и та же награда всегда даёт один и тот же код.

                Не идемпотентна на уровне ответа: первая активация даёт 200,
                повторная — 409 (`reward has already been activated`).

                Ошибки:

                - награда не выдана пользователю — 400, `field: reward_id`;
                - условие награды не выполнено — 400, `field: reward_id`;
                - награда уже активирована — 409;
                - награда просрочена — 409;
                - награда неактивируемая по своей природе — 409.
            operationId: activateReward
            parameters:
                - description: Строковый идентификатор награды (например `streak_5`), НЕ UUID.
                  in: path
                  name: id
                  required: true
                  schema:
                    minLength: 1
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ActivateRewardResponse'
                    description: Награда активирована
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Награда не выдана или условие не выполнено
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Награда уже активирована, просрочена или неактивируема
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Активация награды
            tags:
                - Rewards
    /api/v1/rewards/claim:
        post:
            description: |-
                Вариант активации награды из модуля енота: идентификатор награды
                передаётся в теле, а не в пути, и в ответе поле называется
                `promocode`, а не `code`.

                Функционально дублирует `POST /api/v1/rewards/{id}/activate`
                и работает поверх того же сервиса наград. Для нового кода
                предпочтительна версия с идентификатором в пути.

                Не идемпотентна: повторный вызов для уже активированной награды
                даёт 409.
            operationId: claimReward
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ClaimRewardRequest'
                description: Идентификатор награды
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ClaimRewardResponse'
                    description: Промокод выдан
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Conflict
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Получить промокод награды
            tags:
                - Raccoon
    /api/v1/rewards/my:
        get:
            description: |-
                Награды, выданные текущему пользователю. Поле `code` — промокод —
                заполняется только после активации; до неё оно опущено.
                `next_cursor` всегда пуст, пагинации нет.
            operationId: listMyRewards
            responses:
