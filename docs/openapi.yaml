    /api/v1/items/{id}/photos:
        get:
            description: |-
                Отдаёт плоский массив фотографий, отсортированный по `position`.
                Ответ НЕ обёрнут в `{items, next_cursor}` — это голый массив,
                в отличие от прочих списков. Анонимный доступ разрешён.
            operationId: listItemPhotos
            parameters:
                - description: Идентификатор объявления
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ItemPhoto'
                                type: array
                    description: Массив фотографий
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
                - {}
            summary: Фотографии объявления
            tags:
                - Photos
        post:
            description: |-
                Загрузка одного файла через `multipart/form-data`, поле формы — `photo`.

                Ограничения:

                - Тип определяется по содержимому (сниффинг первых 512 байт),
                а не по заголовку `Content-Type` части. Допустимы только
                `image/jpeg`, `image/png`, `image/webp`.
                - Размер ограничен настройкой `MaxPhotoBytes` (по умолчанию 5 МиБ);
                превышение даёт 400 с `field: photo`.
                - Не более 10 фотографий на объявление (`position` от 0 до 9,
                CHECK-ограничение); одиннадцатая загрузка даёт 409.

                Не идемпотентна: каждый вызов создаёт новую фотографию с новым `position`.

                Побочный эффект: доменное событие о добавлении фотографии
                асинхронно приносит питомцу опыт.
            operationId: addItemPhoto
            parameters:
                - description: Идентификатор объявления
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                photo:
                                    description: Файл изображения — jpeg, png или webp.
                                    format: binary
                                    type: string
                            required:
                                - photo
                            type: object
                description: Файл изображения — jpeg, png или webp.
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ItemPhoto'
                    description: Фотография загружена
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Файл отсутствует, слишком велик или имеет недопустимый тип.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Forbidden
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Достигнут лимит в 10 фотографий
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Загрузка фотографии
            tags:
                - Photos
