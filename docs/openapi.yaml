                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Forbidden
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Удаление фотографии
            tags:
                - Photos
    /api/v1/items/{id}/status:
        post:
            description: |-
                Переводит объявление по конечному автомату статусов. Действие задаётся
                полем `action`, а не целевым статусом.

                Разрешённые переходы:

                | Из | В |
                |---|---|
                | `draft` | `published`, `moderation`, `archived` |
                | `moderation` | `published`, `draft`, `archived` |
                | `published` | `sold`, `archived` |
                | `sold` | — (терминальный) |
                | `archived` | `draft` |

                Соответствие действий: `submit` → `moderation`, `publish` → `published`,
                `sell` → `sold`, `archive` → `archived`, `restore` → `draft`.

                Недопустимый переход даёт 409. Доступно только владельцу.

                Побочный эффект: публикация (`publish`) и продажа (`sell`) порождают
                доменные события, за которые игровой модуль асинхронно начисляет опыт
                питомцу.
            operationId: changeItemStatus
            parameters:
                - description: Идентификатор объявления
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangeStatusRequest'
                description: Действие
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Item'
                    description: Статус изменён
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Forbidden
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Переход не разрешён из текущего статуса
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Смена статуса объявления
            tags:
                - Items
    /api/v1/items/{id}/view:
        post:
            description: |-
                Отмечает, что пользователь открыл карточку объявления. Опыт начисляется
                только за уникальные объявления и не более установленного дневного лимита,
                поэтому повторные открытия и перезагрузки страницы ничего не дают.
                Просмотр собственного объявления опыт не приносит.
            operationId: viewItem
            parameters:
