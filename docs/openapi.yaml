                        - $ref: '#/components/schemas/WSLevelUpPayload'
                        - $ref: '#/components/schemas/WSRewardGrantedPayload'
                        - $ref: '#/components/schemas/WSStreakUpdatedPayload'
                        - $ref: '#/components/schemas/WSErrorPayload'
                request_id:
                    description: |
                        Копия `request_id` из запроса клиента. Отсутствует
                        у широковещательных событий.
                    type: string
                type:
                    enum:
                        - pet.state
                        - pet.updated
                        - pet.hatched
                        - xp.gained
                        - level.up
                        - reward.granted
                        - streak.updated
                        - error
                        - pong
                    type: string
            required:
                - type
            type: object
        WSStreakUpdatedPayload:
            description: Payload события `streak.updated`.
            properties:
                days:
                    description: Длина серии после обновления.
                    minimum: 0
                    type: integer
                milestone:
                    description: Взят ли рубежный день серии.
                    type: boolean
            required:
                - days
                - milestone
            type: object
        WSXPGainedPayload:
            description: Payload события `xp.gained`.
            properties:
                amount:
                    description: Сколько опыта начислено этим событием.
                    type: integer
                reason:
                    description: Код причины начисления — какое действие его вызвало.
                    type: string
                total:
                    description: Опыт в пределах текущего уровня после начисления.
                    minimum: 0
                    type: integer
            required:
                - amount
                - reason
                - total
            type: object
        api.QuestListResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/api.questItem'
                    type: array
                    uniqueItems: false
                next_cursor:
                    type: string
            type: object
        api.checkInInfo:
            properties:
                level:
                    type: integer
                next_level_xp:
                    type: integer
                previous_level:
                    type: integer
                streak:
                    $ref: '#/components/schemas/Streak'
                unlocked_rewards:
                    items:
                        type: string
                    type: array
                    uniqueItems: false
                xp_granted:
                    type: integer
            type: object
        api.questItem:
            properties:
                action:
                    type: string
                claimed:
                    type: boolean
                completed:
                    type: boolean
                id:
                    type: string
                progress_current:
                    type: integer
                reward_xp:
                    type: integer
                target:
                    type: integer
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            description: |
                JWT, подписанный HS256. Клеймы: `sub` — UUID пользователя,
                `role` — роль, `exp` — момент истечения, `iat` — момент выпуска,
                `jti` — уникальный идентификатор токена.

                Просроченный токен и токен с неверной подписью одинаково
                дают 401 с кодом `unauthorized`.
            in: header
            name: Authorization
            scheme: bearer
            type: http
info:
    contact:
        name: Avito Hack Team
    description: |
        API объявлений с игровым слоем: пользователь заводит объявления, добавляет фотографии,
        ведёт избранное, а параллельно развивает питомца — за действия в маркетплейсе
        начисляется опыт, растут уровень и стрик, открываются награды.

        ## Конверт ошибок

        Все ошибки возвращаются единым конвертом `ErrorEnvelope`:

        ```json
        {"error": {"code": "validation_error", "message": "title must be at least 3 characters", "field": "title", "request_id": "..."}}
        ```

        Поля `field` и `request_id` опциональны и опускаются, когда пусты.
        Коды: `validation_error`, `bad_request`, `unauthorized`, `forbidden`,
        `not_found`, `conflict`, `internal_error`.

        ## Авторизация

        JWT (HS256) передаётся в заголовке `Authorization: Bearer <token>`.
        Срок жизни токена лежит в клейме `exp` внутри самого токена — отдельного поля
        `expires_at` в ответах на регистрацию и вход нет. В клеймах также присутствуют
        `sub` (идентификатор пользователя) и `role` (`user` | `moderator` | `admin`).
        WebSocket авторизуется query-параметром `token`, так как браузерный
        WebSocket API не позволяет задавать заголовки.

        ## Пагинация

        Списки используют keyset-курсоры, непрозрачные для клиента (base64url).
        В проекте два независимых формата курсора:

        - **Временной** (`created_at|id`) — объявления, избранное, история сводок.
        - **Лидербордный** (`level|xp|user_id`) — только `GET /leaderboard`.

        Курсоры не взаимозаменяемы. Ответ содержит `next_cursor`; поле отсутствует,
        когда страница последняя. Параметр `limit` по умолчанию 20, максимум 100;
        значения вне диапазона молча нормализуются, а не отклоняются.

        ## Деньги

        Цена объявления — целое число копеек в поле `price`. 1500000 означает 15 000 ₽.

        ## Тело запроса

        JSON-декодер работает в строгом режиме: неизвестные поля в теле приводят
        к ответу 400 с кодом `bad_request`.
    license:
        name: MIT
    summary: REST и WebSocket API маркетплейса с геймификацией (питомец-енот)
    title: Avito Hack API
    version: 1.0.0
openapi: 3.1.0
paths:
    /api/v1/auth/login:
        post:
            description: |-
                Проверяет пару e-mail/пароль и выдаёт JWT.

                Идемпотентна по побочным эффектам, но каждый вызов выпускает новый токен
                с новым `jti`. Срок действия — в клейме `exp`; отдельного поля
                `expires_at` в ответе нет. Неверные учётные данные дают 401 без
                уточнения, что именно неверно.
            operationId: login
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                description: Учётные данные
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Session'
                    description: Токен выдан
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Неверный e-mail или пароль
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - {}
            summary: Вход
            tags:
                - Auth
    /api/v1/auth/refresh:
        post:
            description: |-
                Перевыпускает JWT для владельца действующего токена: клиент обменивает
                ещё живой токен на новый с продлённым `exp` и новым `jti`. Это скользящее
                окно — отдельного refresh-токена в системе нет, поэтому истёкший токен
                продлить нельзя и остаётся только повторный вход.

                Ответ совпадает по форме с `POST /api/v1/auth/login`. Старый токен
                продолжает действовать до собственного `exp`: ревокации нет.
            operationId: refreshSession
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Session'
                    description: Выдан новый токен
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Токен отсутствует, истёк или повреждён
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Пользователь удалён
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Продление сессии
            tags:
                - Auth
    /api/v1/auth/register:
        post:
            description: |-
                Создаёт пользователя с ролью `user` и заводит для него питомца на стадии `baby`.

                Не идемпотентна: повторная регистрация того же e-mail даёт 409.
                Ответ совпадает по форме с `POST /api/v1/auth/login` — сразу приходит
                токен, отдельный вход после регистрации не нужен. Поля `expires_at` нет:
                срок жизни лежит в claim `exp` внутри самого JWT.

                Пароль хранится как bcrypt-хеш. Ограничение длины пароля задаётся
                доменом (`user/domain`), а не тегом `validate`, поэтому слишком короткий
                пароль отклоняется с кодом `validation_error`, а не схемной ошибкой.
            operationId: register
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterRequest'
                description: Учётные данные
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Session'
                    description: Пользователь создан, сессия открыта
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: E-mail уже зарегистрирован
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - {}
            summary: Регистрация пользователя
            tags:
                - Auth
    /api/v1/badges:
        get:
            description: |-
                Плоский массив бейджей — без обёртки `{items}` и без пагинации.
                Поле `earned_at` пусто (и опущено) у ещё не полученных бейджей;
                формат времени — RFC 3339 в UTC.
            operationId: listBadges
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Badge'
                                type: array
                    description: Массив бейджей
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Бейджи пользователя
            tags:
                - Raccoon
    /api/v1/checkin:
        post:
            description: |-
                Отмечает вход за текущий день, начисляет опыт и продлевает стрик.
                Тело запроса не требуется.

                Идемпотентна в пределах суток: повторный чек-ин в тот же день
                даёт 409 (`action has already been performed today`). Именно этот
                конфликт — нормальный, ожидаемый ответ для клиента, который
                не знает, был ли уже чек-ин.

                Эндпоинт сохранён для обратной совместимости. Клиенту он больше
                не нужен: `GET /api/v1/pet` засчитывает чек-ин сам и сообщает об этом
                полями `checkin_applied` и `checkin`. Оба пути делят одно состояние,
                поэтому после автоматического чек-ина этот вызов вернёт 409.

                Логика стрика:

                - Вход на следующий день после предыдущего — стрик продолжается
                (`continued: true`).
                - Пропуск дня при наличии заморозки — она тратится
                (`freeze_used: true`), стрик сохраняется. Заморозок не больше 3.
                - Пропуск дня без заморозки — стрик обнуляется (`reset: true`).
                - На рубежных значениях стрика начисляется бонус
                (`milestone_bonus` > 0, `milestone_reached` — достигнутый рубеж).

                Побочные эффекты: начисление опыта, возможный рост уровня,
                автоматическая выдача наград, для которых выполнились условия
                (их идентификаторы — в `unlocked_rewards`). По WebSocket уходят
                `xp.gained`, при росте уровня `level.up`, при выдаче наград
                `reward.granted`, а также `streak.updated`.
            operationId: checkIn
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckInResult'
                    description: Чек-ин засчитан
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Чек-ин за сегодня уже выполнен
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Ежедневный чек-ин
            tags:
                - Pet
    /api/v1/favorites:
        get:
            description: |-
                Избранные объявления владельца токена, свежие сверху.
                Пагинация — временной курсор по времени добавления в избранное.
                Поле `photo_url` содержит первую фотографию объявления и опускается,
                если фотографий нет.
            operationId: listFavorites
            parameters:
                - description: Размер страницы. По умолчанию 20, максимум 100.
                  in: query
                  name: limit
                  schema:
                    default: 20
                    maximum: 100
                    type: integer
                - description: Временной курсор из `next_cursor` предыдущей страницы.
                  in: query
                  name: cursor
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FavoriteListResponse'
                    description: Страница избранного
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Список избранного
            tags:
                - Favorites
    /api/v1/games:
        get:
            description: |-
                Все зарегистрированные мини-игры с прогрессом текущего пользователя:
                выполнен ли дневной норматив и на какой неделе серия. Новая игра
                появляется здесь автоматически после регистрации в реестре.
            operationId: listGames
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/GameResponse'
                                type: array
                    description: Мини-игры
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Список мини-игр
            tags:
                - Games
    /api/v1/games/{slug}/reward/claim:
        post:
            description: |-
                Выдаёт промокод, когда недельная серия достигла семи дней подряд.
                После выдачи счётчик серии обнуляется и следующий цикл начинается заново,
                поэтому повторный вызов до новой серии даёт 409.
            operationId: claimGameReward
            parameters:
                - description: Идентификатор мини-игры
                  example: moreless
                  in: path
                  name: slug
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ClaimGameRewardResponse'
                    description: Промокод выдан
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Conflict
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Забрать награду за недельную серию
            tags:
                - Games
    /api/v1/games/{slug}/rounds:
        post:
            description: |-
                Создаёт серверный раунд и отдаёт первый вопрос. Незавершённый предыдущий
                раунд той же игры автоматически засчитывается как проигранный, поэтому
                активный раунд всегда ровно один. Ответы хранятся только на сервере.
            operationId: startGameRound
            parameters:
                - description: Идентификатор мини-игры
                  example: moreless
                  in: path
                  name: slug
                  required: true
                  schema:
                    type: string
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StartRoundResponse'
                    description: Раунд начат
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Начать раунд мини-игры
            tags:
                - Games
    /api/v1/games/{slug}/rounds/{rid}/guess:
        post:
            description: |-
                Применяет ход игрока. Формат поля `move` задаёт конкретная игра:
                для `moreless` это `{"choice":"higher"}` или `{"choice":"lower"}`.

                Чужой раунд отдаётся как 404, а не 403. Повторный ход в уже завершённом
                раунде даёт 409, поэтому переигровка невозможна. Ответ содержит `reveal`
                с раскрытой правдой только за уже сыгранный ход.
            operationId: guessGameRound
            parameters:
                - description: Идентификатор мини-игры
                  example: moreless
                  in: path
                  name: slug
                  required: true
                  schema:
                    type: string
                - description: Публичный идентификатор раунда (display_id)
                  in: path
                  name: rid
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GuessRequest'
                description: Ход игрока
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GuessResponse'
                    description: Ход учтён
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Conflict
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Сделать ход в раунде
            tags:
                - Games
    /api/v1/games/{slug}/state:
        get:
            description: |-
                Недельная серия, дневной прогресс и активный раунд, если он есть.
                Активный раунд отдаётся вместе с текущим вопросом, поэтому клиент
                может продолжить игру после перезагрузки страницы. Скрытая цена
                в вопрос никогда не попадает.
            operationId: getGameState
            parameters:
                - description: Идентификатор мини-игры
                  example: moreless
                  in: path
                  name: slug
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GameStateResponse'
                    description: Состояние игры
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Состояние мини-игры
            tags:
                - Games
    /api/v1/items:
        get:
            description: |-
                Анонимный доступ разрешён (`OptionalAuth`): токен читается, если передан,
                но не требуется. Анонимно и для чужого пользователя видны только
                объявления в статусах `published` и `sold`; владелец дополнительно видит
                собственные черновики.

                Пагинация — временной курсор. Побочных эффектов нет.
            operationId: listItems
            parameters:
                - description: Размер страницы. По умолчанию 20, максимум 100.
                  in: query
                  name: limit
                  schema:
                    default: 20
                    maximum: 100
                    type: integer
                - description: Временной курсор из `next_cursor` предыдущей страницы.
                  in: query
                  name: cursor
                  schema:
                    type: string
                - description: Фильтр по статусу.
                  in: query
                  name: status
                  schema:
                    enum:
                        - draft
                        - moderation
                        - published
                        - sold
                        - archived
                    type: string
                - description: Фильтр по владельцу. Невалидный UUID даёт 400.
                  in: query
                  name: owner_id
                  schema:
                    format: uuid
                    type: string
                - description: Полнотекстовый поиск по заголовку.
                  in: query
                  name: search
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ItemListResponse'
                    description: Страница объявлений
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
                - {}
            summary: Публичный список объявлений
            tags:
                - Items
        post:
            description: |-
                Создаёт объявление в статусе `draft` от имени владельца токена.

                Не идемпотентна — каждый вызов создаёт новую запись.

                Побочный эффект: публикуется доменное событие, на которое подписан
                игровой модуль. Опыт за создание объявления начисляется асинхронно
                (через Kafka либо через in-process шину, если Kafka выключена),
                поэтому в ответе изменение XP не отражается — его нужно получать
                из WebSocket-события `xp.gained` или повторным `GET /api/v1/pet`.
            operationId: createItem
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateItemRequest'
                description: Данные объявления
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Item'
                    description: Объявление создано
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error
            security:
                - bearerAuth: []
            summary: Создание объявления
            tags:
                - Items
