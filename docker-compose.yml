name: avito-hack

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - "log_line_prefix=\e[2m%t\e[0m \e[35m\e[1mPG \e[0m %q\e[2m%u@%d\e[0m "
      - -c
      - log_min_messages=warning
      - -c
      - log_min_duration_statement=200ms
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  kafka:
    image: apache/kafka:3.9.0
    profiles: ["kafka"]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [backend]

  migrate:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_COLOR: ${LOG_COLOR:-always}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks: [backend]

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    restart: unless-stopped
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-1h}
      REWARD_HMAC_SECRET: ${REWARD_HMAC_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_COLOR: ${LOG_COLOR:-always}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      MAX_PHOTO_BYTES: ${MAX_PHOTO_BYTES:-5242880}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      UPLOAD_URL: ${UPLOAD_URL:-/uploads}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-pet.activity}
      KAFKA_GROUP: ${KAFKA_GROUP:-pet-service}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-pet-service}
      KAFKA_TIMEOUT: ${KAFKA_TIMEOUT:-3s}
      PET_FLUSH_INTERVAL: ${PET_FLUSH_INTERVAL:-15s}
      PET_FLUSH_BATCH_SIZE: ${PET_FLUSH_BATCH_SIZE:-100}
    user: "65532:65532"
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
        required: false
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [backend, frontend]

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL-}
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-ru}
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [frontend]

volumes:
  pgdata:
  redisdata:
  kafkadata:
  uploads:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
